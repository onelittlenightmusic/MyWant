# 緑帯 — 3rd kyu — Overlapping
#
# Put two of the yellow belt's "pointing" moves side by side. Two wants aimed at
# the same memo group answer together something neither answers alone — that is
# what a kata is.
#
# 糧 carries no join: neither restaurant nor budget has a place parameter, so
# "the same destination" cannot be established mechanically. The combination is
# worth just as much, so it stays a kata; it is simply not measured per group.
levels:
  - id: level-3
    name: 緑帯
    grade: 3rd kyu
    order: 3
    theme: Overlapping
    subtitle: One destination, seen through two wants
    color: "#22c55e"
    accent: "#15803d"
    unlocked: false         # opens once the yellow belt is promoted
    kata: [kata-kasa, kata-koku, kata-zeni, kata-machi, kata-mode, kata-kate]
    promotion:
      requiredKata: 3       # 3 of 6 to be promoted

kata:
  - id: kata-kasa
    name: 傘
    reading: kasa
    level: level-3
    order: 1
    intent: Overlap a route and a forecast on the same destination
    yields: Rain laid over the walking legs — whether an umbrella is needed
    contains: [kata-kin, kata-ate, kata-sora]
    join: { kind: thing_group }
    waza:
      - { kind: thing, subtype: station }
      - { kind: thing, subtype: city }
      - { kind: want_type, type: transit_search, join: to }
      - { kind: want_type, type: weather, join: weather_city }
    # What it leaves where it was held — a route plus a forecast is knowing to take one.
    mark: { label: 傘, icon: Umbrella }
    mastery: { shoden: 1, kaiden: 3 }
    unlocks:
      shoden: { vocabulary: ["The pair earns a name"] }
      kaiden: { shortcuts: ["Placing the route brings the forecast with it", "Only the umbrella answer is left to read"] }

  - id: kata-koku
    name: 刻
    reading: koku
    level: level-3
    order: 2
    intent: Overlap a route and a reminder on the same destination
    yields: A departure time worked backwards from when you want to arrive
    contains: [kata-ate]
    join: { kind: thing_group }
    waza:
      - { kind: thing, subtype: station }
      - { kind: want_type, type: transit_search, join: to }
      # Not "and an alarm somewhere". The route's own departure has to be what
      # the alarm goes off on — that IS the form, and written as a bare
      # want_type it was satisfied by any alarm on the board and said nothing
      # about working the time backwards.
      - { kind: want_type, type: reminder,
          importFrom: { type: transit_search, state: departure, into: event_time } }
    # What it leaves where it was held — a departure that tells you when to leave.
    mark: { label: 刻, icon: AlarmClock }
    mastery: { shoden: 1, kaiden: 3 }
    unlocks:
      shoden: { vocabulary: ["The pair earns a name"] }
      kaiden: { shortcuts: ["Placing the route brings the departure alert with it", "Only the departure time is left to read"] }

  - id: kata-zeni
    name: 銭
    reading: zeni
    level: level-3
    order: 3
    intent: Overlap a route and a budget on the same destination
    yields: The fare lands in the budget, and the round trip has a total
    contains: [kata-ate]
    join: { kind: thing_group }
    waza:
      - { kind: thing, subtype: station }
      - { kind: want_type, type: transit_search, join: to }
      # "The fare lands in the budget" — so the route has to be UNDER the
      # budget, which is how a budget is fed: it adds up what the wants below
      # it report. A budget sitting next to the route knows nothing about it,
      # and that is all the form used to ask for.
      # `status: any` because a budget never finishes. It is a watcher: it sits
      # at `reaching` and keeps adding up what its children report, so asking
      # for a 極まった one asks for something that does not happen — and the
      # board then advised placing a second budget beside the two already there.
      - { kind: want_type, type: budget, status: any, owns: { type: transit_search } }
    # What it leaves where it was held — a route priced is fare counted out.
    mark: { label: 銭, icon: Coins }
    mastery: { shoden: 1, kaiden: 3 }
    unlocks:
      shoden: { vocabulary: ["The pair earns a name"] }
      kaiden: { shortcuts: ["Placing the route puts the fare on the budget", "Only the total is left to read"] }

  - id: kata-machi
    name: 待
    reading: machi
    level: level-3
    order: 4
    intent: Overlap a route and an arrival watch on the same destination
    yields: Arriving closes the route; falling behind redraws it
    contains: [kata-ate, kata-chaku]
    join: { kind: thing_group }
    waza:
      - { kind: thing, subtype: place }
      - { kind: want_type, type: transit_search, join: to }
      - { kind: want_type, type: place_arrival, status: any, join: place }
    # What it leaves where it was held — a place two people arrive at is a meeting.
    mark: { label: 待, icon: Handshake }
    mastery: { shoden: 1, kaiden: 3 }
    unlocks:
      shoden: { vocabulary: ["Arrivals are kept in the record"] }
      kaiden: { autonomy: ["A delay is rebuilt into a new route without asking"] }

  # The venue is a station too. Put the occasion and that station into one group
  # — the same judgement 近 asks for — and the route knows which occasion it
  # serves. 券 has to be held first, so what this overlaps is a ticket you have,
  # not one you are hoping for.
  - id: kata-mode
    name: 詣
    reading: mode
    level: level-3
    order: 5
    intent: Overlap a ticket and a route on the same occasion
    yields: A departure time worked backwards from the curtain
    contains: [kata-ate, kata-ken]
    join: { kind: thing_group }
    waza:
      - { kind: thing, subtype: event }
      - { kind: thing, subtype: station }
      - { kind: want_type, type: event_ticket, join: event }
      - { kind: want_type, type: transit_search, join: to }
    # What it leaves where it was held — an occasion travelled to is a place visited.
    mark: { label: 詣, icon: Landmark }
    mastery: { shoden: 1, kaiden: 3 }
    unlocks:
      shoden: { vocabulary: ["The occasion and the way there count as one thing"] }
      kaiden: { shortcuts: ["Securing the ticket brings the route with it", "Only the departure time is left to read"] }

  # No join — neither restaurant nor budget has a place parameter.
  - id: kata-kate
    name: 糧
    reading: kate
    level: level-3
    order: 6
    intent: Overlap a restaurant and a budget
    yields: The likely bill for the booking lands in the budget
    waza:
      - { kind: want_type, type: restaurant }
      - { kind: want_type, type: budget }
    # What it leaves where it was held — a meal within a budget is still a meal.
    mark: { label: 糧, icon: Utensils }
    mastery: { shoden: 1, kaiden: 3 }
    unlocks:
      shoden: { vocabulary: ["The restaurant's cost joins the total"] }
      kaiden: { shortcuts: ["Choosing a restaurant puts its estimate on the budget", "The budget narrows the restaurant suggestions"] }
