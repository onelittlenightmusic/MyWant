# 合帯 — Combining
#
# The other belts are about doing: place a want, point it somewhere, overlap
# two of them. This one is about DISCOVERING — which two things, put in one
# constellation, turn out to be one thing.
#
# Nothing is produced here. Holding a form does not make an object; what it
# gives you is the word for a pair you did not know went together, and the
# mark that word leaves on the line between them. Making things from
# combinations is a separate mechanism and belongs elsewhere.
#
# So every kata here is veiled. The board lists it with the right number of
# blanks and nothing else: "there is a form of two 所作 here" is the
# invitation, and which two is what you go and find. 極めた once, it stays
# open — a form you have held is one you know. 練度 measures something else:
# holding the same form on different constellations.
#
# Always open as a belt. Discovery is not a rank — there is nothing to be
# promoted to and nothing to earn the right to try. Standing on the first
# belt you can already put any two things together and see, which is the only
# way a discovery belt can work.
levels:
  - id: level-awase
    name: 合帯
    grade: 合
    order: 90              # after the graded belts; it is beside them, not above
    theme: Combining
    subtitle: Two things in one constellation make a third
    color: "#f59e0b"
    accent: "#b45309"
    unlocked: true
    kata: [kata-sen, kata-aida, kata-kei, kata-ren, kata-haba, kata-kumi,
           kata-hatchaku, kata-sou, kata-kai, kata-yaku, kata-koro, kata-en]

kata:
  # Each is two 所作 of kind `thing` under a join, which the evaluator reads as
  # "one constellation holds a thing of this subtype and a thing of that one".
  #
  # The name is the RELATION, never a product. A form makes nothing; what it
  # gives is the word for a pair that turns out to go together, so the word has
  # to be the name of how they go together — 発着 is what a time is AT a
  # station. `mark` carries that word onto the line between them.
  #
  # Station + city is deliberately absent: 近 on the white belt already is that
  # pair, and it was there first. A form invented here that duplicates one of
  # the graded belts is not a second discovery, it is the same one with two
  # names — so 近 wears the mark and this belt does not repeat it.
  # ── 同じもの二つ ──────────────────────────────────────────────────────────
  #
  # A pair does not have to be a pair of DIFFERENT things. Two stations in one
  # constellation are a line; two times are a span. These are the plainest
  # forms on the belt and the easiest to stumble into, which is why they open
  # it — somebody who has named two stations has already half-found one.
  #
  # Written as ONE 所作 with `minCount: 2`, never as the same 所作 twice: a
  # thing 所作 inside a join asks how many values of that subtype the
  # constellation holds, so two copies of it would both be answered by the one
  # station and the form would stand on half of itself.
  - id: kata-sen
    name: 線
    reading: sen
    level: level-awase
    order: 1
    veiled: true
    intent: Two stations, held as one place
    yields: The run between them, rather than two names
    join: { kind: thing_group }
    waza:
      - { kind: thing, subtype: station, minCount: 2 }
    mark: { label: 線, icon: TrainTrack }
    mastery: { shoden: 1, kaiden: 3 }

  - id: kata-aida
