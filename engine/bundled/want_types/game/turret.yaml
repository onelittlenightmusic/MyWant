wantType:
  metadata:
    name: turret
    title: Turret
    description: >-
      A want tile that fights: placed on the board, it hits the nearest enemy
      of a room defense within its range, by itself, every so often. Where it
      stands is what it defends — and, standing in a room, it is a want the
      enemies go for too.
    version: '1.0'
    category: game
    pattern: independent
    labels:
      type-icon: "Crosshair"
      category-icon: "Gamepad2"
      category-bg-light: "linear-gradient(160deg, #fecaca 0%, #fde68a 100%)"
      category-bg-dark: "linear-gradient(160deg, #7f1d1d 0%, #78350f 100%)"
  parameters:
  - name: range
    description: How far it reaches, in cells
    type: float64
    default: 3
    required: false
  - name: damage
    description: How much one hit takes off an enemy
    type: float64
    default: 1
    required: false
  - name: interval
    description: Seconds between hits
    type: float64
    default: 1.5
    required: false
  - name: strategy
    description: >-
      Which enemy in reach it hits: nearest (the closest), weakest (the one
      with least left), or guard (the one going for whatever in the room has
      least left). What it hits is its connection — a subscription to that
      enemy's hp, drawn on the board — and it keeps on the enemy it is
      connected to while that one is in reach, so a want deciding how to
      fight (reading the enemies' fields) aims it by connecting it.
    type: string
    default: nearest
    required: false
  state:
  - name: shots
    description: Hits it has made
    type: int
    label: current
    volatile: true
