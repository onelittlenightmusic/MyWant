wantType:
  metadata:
    name: freeze
    title: Freeze
    description: >-
      A want tile that holds enemies where they are: like a turret it hits an
      enemy in reach every so often, by itself, but its hit stops the enemy —
      it neither moves nor wears anything down — for a while (duration). It
      keeps to enemies not already held. What it is holding is its
      connection, drawn on the board in yellow.
    version: '1.0'
    category: game
    pattern: independent
    labels:
      type-icon: "Snowflake"
      category-icon: "Gamepad2"
      category-bg-light: "linear-gradient(160deg, #fef08a 0%, #bae6fd 100%)"
      category-bg-dark: "linear-gradient(160deg, #713f12 0%, #0c4a6e 100%)"
  parameters:
  - name: range
    description: How far it reaches, in cells
    type: float64
    default: 3
    required: false
  - name: interval
    description: Seconds between hits
    type: float64
    default: 3
    required: false
  - name: duration
    description: Seconds an enemy it hits is held
    type: float64
    default: 2.5
    required: false
  - name: damage
    description: How much one hit also takes off (none, by default — it holds)
    type: float64
    default: 0
    required: false
  - name: strategy
    description: Which enemy in reach it holds — nearest, weakest, or guard (as a turret's)
    type: string
    default: nearest
    required: false
  state:
  - name: shots
    description: Hits it has made
    type: int
    label: current
    volatile: true
