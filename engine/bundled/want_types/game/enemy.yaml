wantType:
  metadata:
    name: enemy
    title: Enemy
    description: >-
      One enemy of a room defense — a want tile of its own: where it is is
      its tile's place, what is left of it its hp, and what it goes for its
      connection (a subscription to that want's hp, drawn on the board as an
      attack). Made by its room_defense want (named on its label
      mywant.io/enemy-of); gone when defeated.
    version: '1.0'
    category: game
    pattern: independent
    labels:
      type-icon: "Skull"
      category-icon: "Gamepad2"
      category-bg-light: "linear-gradient(160deg, #fecaca 0%, #fde68a 100%)"
      category-bg-dark: "linear-gradient(160deg, #7f1d1d 0%, #78350f 100%)"
  parameters:
  - name: max_hp
    description: How many hits it takes
    type: float64
    default: 3
    required: false
  state:
  - name: hp
    description: What is left of it
    type: float64
    label: current
    persistent: true
  - name: max_hp
    description: What it started with
    type: float64
    label: current
    persistent: true
  - name: target
    description: The name of the want it is going for
    type: string
    label: current
    volatile: true
  - name: frozen
    description: Held where it is by a freeze — not moving, not wearing anything down
    type: bool
    label: current
  - name: defeated
    description: Brought down — left on the board a moment, for the hit that did it to be seen landing, then gone
    type: bool
    label: current
