# predefined.yaml
# Common state fields automatically merged into every want type definition.
# These fields are available in SetCurrent/GetCurrent without repeating them in each type's YAML.
# Type-specific definitions in individual YAMLs take precedence over these defaults.
predefined:
  state:
    - name: achieved
      description: Whether the want has achieved its goal
      type: bool
      label: current
      persistent: true
      initialValue: false
    - name: achieving_percentage
      description: Progress percentage towards the goal (0-100)
      type: int
      subType: percentage
      label: current
      persistent: true
      initialValue: 0
    - name: completed
      description: Whether execution has completed
      type: bool
      label: current
      persistent: true
      initialValue: false
    - name: action_by_agent
      description: Name of the agent that last acted on this want
      type: string
      label: current
      persistent: true
      initialValue: ""
    - name: final_result
      description: Final output value of this want
      type: string
      label: current
      persistent: true
      initialValue: ""
    - name: agent_result
      description: Raw result object returned by agent execution (written by DoAgent)
      type: object
      label: current
      persistent: true
      initialValue: null
    - name: desired_dispatch
      description: Dispatch requests proposed by a thinker child
      type: object
      label: plan
      persistent: false
      initialValue: null
    # A word over this want's tile on the canvas, shown for a few seconds
    # whenever the value CHANGES (see useTileSpeech in the GUI). Predefined
    # rather than declared per type, because being able to say what you just
    # did is not a property of any one kind of want: an agent finishing, a
    # reader coming alive, a script reporting — all of them have moments worth
    # a sentence, and a board where only the characters can speak is a board
    # where nothing else can tell you what happened.
    #
    # Not persistent: it is an utterance, not a fact about the want. Reloading
    # a board should not make everything on it speak again.
    - name: say
      description: A sentence to show over this want's tile, briefly
      type: string
      label: current
      persistent: false
      initialValue: ""
