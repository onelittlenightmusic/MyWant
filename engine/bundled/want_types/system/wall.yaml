wantType:
  metadata:
    name: wall
    title: Wall
    description: |
      A static, impassable obstacle placed on the canvas grid. CursorMan cannot
      move onto a cell occupied by a wall — it blocks movement in both discrete
      (keyboard/D-pad) and analog-stick drag navigation.

      Purely a canvas-grid fixture: it has no runtime behavior and is not shown
      in the want dashboard's card list (labels.list-visible: "false").
    version: '1.0'
    category: game
    pattern: independent
    labels:
      # The tile is not a card with a brick icon on it — it is bricks.
      form-style: brick
      type-icon: "BrickWall"
      category-icon: "BrickWall"
      list-visible: "false"
      type-tone-color: "#7a5230"

  parameters:
    - name: _dummy
      description: Internal dummy parameter
      type: string
      required: false

  # A wall is a coordinate and a shape, both read off its labels by the canvas —
  # there is nothing for a progression loop to do. Without an achievement
  # condition IsAchieved() falls through to this very field, finds nothing, and
  # answers false forever, so every wall kept a goroutine waking every 20ms for
  # the life of the server. On a drawn world that was 152 of them, and the
  # largest single source of idle CPU left after the agent work.
  #
  # Declaring it achieved from the start lets StartProgressionLoop run its one
  # final cycle and return, ending the goroutine. The want stays in the graph
  # and on the canvas; it simply stops asking whether anything has changed.
  state:
    - name: achieved
      type: bool
      label: current
      persistent: true
      initialValue: true

  examples:
    - title: Place a wall
      description: A single-cell wall blocking passage at a fixed canvas position.
      want:
        metadata:
          name: wall-1
          type: wall
          labels:
            mywant.io/canvas-x: "3"
            mywant.io/canvas-y: "2"
        spec:
          params: {}
