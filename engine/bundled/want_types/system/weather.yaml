wantType:
  metadata:
    name: weather
    title: Weather Fetched
    description: |
      Fetches today's weather for a city and stores the result in state.
      Uses wttr.in (no API key) or OpenWeatherMap if an API key is provided.
      Achieved once weather has been fetched for today's date.
    version: '2.0'
    category: weather
    pattern: independent
    labels:
      # What the robot reads a request against, when it asks Laya which want
      # it is: the type in a few words of its own (laya-option).
      laya-option: "ある場所の天気を調べる"
      aliases: "weather,天気"
      # Drawn on the canvas as a probe: a reach out to the place it reads.
      form-type: probe
      # The tile wears the weather itself — sun, cloud, rain — read from the
      # condition of its latest answer (see datatypes.yaml's weather icons).
      # A temperature would be one half of a sentence; the sky is the whole of
      # what a glance at this tile is asking.
      tile-icon: output
      # And it dresses for the weather: an umbrella up over it while it reads
      # rain, storm or snow, a sun while it reads sunny, nothing otherwise.
      tile-effect: weather
      riffable: source
      user-control: 'true'
      full-screen-display: 'true'
      category-icon: CloudSun
      category-bg-light: "linear-gradient(160deg, #fde68a 0%, #bfdbfe 100%)"
      category-bg-dark: "linear-gradient(160deg, #b45309 0%, #1d4ed8 100%)"

  finalResultField: weather_text

  # When it tells of its answer, besides every new one (the standard timing
  # "answer"). condition_changed: the weather itself turned (晴れ → 雨), not
  # only the temperature — a want that wants only this turns answer off.
  timings:
    - name: failed
      irregular: true   # out of the ordinary: the robot looks at it
      requires: [retry]   # what it needs done (met by a capability that attends to it)
      description: 天気が取れなかったとき
      icon: cloud-off
      murmur: true
      notify: false
    - name: condition_changed
      description: 天気が変わったとき（晴れ→雨など）
      icon: cloud-sun-rain
      onChange: weather_condition
      murmur: true
      notify: true

  achievedWhen:
    field: weather_date
    operator: "=="
    value: "$today"

  # What a want of this type does with a murmur it heard (spec.hear).
  hearing:
    kind: say
    description: その時間と場所の天気を答える
  parameters:
    - name: at
      description: Where to read the weather — a city, place or station
      type: string
      subType: city
      required: false
      default: "Tokyo"

    - name: openweathermap_api_key
      description: OpenWeatherMap API key. Falls back to OPENWEATHERMAP_API_KEY env var. If absent, uses wttr.in.
      type: string
      subType: secret
      recordThing: false
      required: false
      default: ""

  state:
    - name: weather_city
      description: City name (copied from param)
      type: string
      subType: city
      persistent: false
      label: current
      initialValue: 'Tokyo'

    - name: openweathermap_api_key
      description: OpenWeatherMap API key (copied from param)
      type: string
      subType: secret
      recordThing: false
      persistent: false
      label: current
      initialValue: ''

    - name: weather_text
      description: One-line weather summary
      type: string
      subType: weather
      persistent: true
      label: current
      exposable: true
      initialValue: ''

    - name: weather_condition
      description: Canonical condition (sunny/cloudy/rain/storm/snow/fog/default)
      type: string
      subType: weather
      persistent: true
      label: current
      exposable: true
      initialValue: ''

    - name: weather_date
      description: Date when weather was last fetched (YYYY-MM-DD)
      type: string
      persistent: true
      label: current
      initialValue: ''

    - name: error
      description: Why the last fetch failed (every source tried); empty when it succeeded
      type: string
      persistent: false
      label: current
      initialValue: ''

    # What it heard another want say and looked up for it (spec.hear): a
    # reservation's time and place → the forecast there, then. Its voice says
    # it in answer (weather.voice.py, event "heard").
    - name: heard_forecast
      description: 聞いたつぶやきの時刻・場所の予報 {murmur_id, time, place, city, text}
      type: object
      persistent: true
      label: current
      initialValue: null

  onInitialize:
    params:
      weather_city: at
      openweathermap_api_key: openweathermap_api_key
    current:
      weather_date: ''

  onAchieved:
    mergeParent:
      weather_done: true
      weather_text: "${weather_text}"

  requires:
    - weather_agency

  # How a want of this type is asked for, in words, and what it is made with
  # (want-spec asks): what reads requests (the robot, Laya) learns from these
  # and is tested on them. A parameter left out is one the request does not say.
  asks:
    - say: "中野の天気"
      variants: ["中野の天気を出して", "中野は晴れてる？天気を見せて", "中野の今日の天気"]
      params: {"at": "中野"}
    - say: "国分寺の天気を見せて"
      variants: ["国分寺の天気", "国分寺は雨？天気を調べて", "国分寺の今日の天気を出して"]
      params: {"at": "国分寺"}
    - say: "札幌の天気"
      variants: ["札幌の天気を調べて", "札幌は今日どんな天気？", "札幌の天気予報"]
      params: {"at": "札幌"}
    - say: "Tokyoの天気を出して"
      variants: ["Tokyoの天気", "Tokyoの天気予報を見せて", "Tokyoは晴れ？"]
      params: {"at": "Tokyo"}
    - say: "横浜の天気が知りたい"
      variants: ["横浜の天気", "横浜の天気を調べて", "横浜は今日雨降る？"]
      params: {"at": "横浜"}
    # <alias> is said as each of the type's aliases (天気, weather); <home> is
    # where the person who asked goes at that part of the day.
    - say: "<alias>"
      variants: ["<alias>を見せて", "今日の<alias>"]
      at: "18:00"
      params: {"at": "<home>"}
    - say: "<alias>を出して"
      variants: ["<alias>を置いて", "<alias>を調べて"]
      at: "13:00"
      params: {"at": "<home>"}
    - say: "<alias> 札幌"
      variants: ["札幌の<alias>", "<alias>、札幌"]
      params: {"at": "札幌"}
