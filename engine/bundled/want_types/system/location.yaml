wantType:
  metadata:
    name: location
    title: Browser Location
    description: "Receives geolocation data pushed from a browser device via webhook. Stores lat/lng/accuracy as exposable state fields."
    version: "1.0"
    category: system
    pattern: independent
    labels:
      riffable: source
      user-control: "true"
      type-icon: MapPin
  # The coordinate object is the location's result — so an X-press on the card
  # aura-marks it (see cardAuraMark), and it names a place in one press.
  finalResultField: coordinate

  parameters:
    - name: label
      description: Display label for this location sensor
      type: string
      default: "My Location"
      required: false
    - name: fetch_elevation
      description: |
        Look up the ground height at this position and keep it in `elevation`.
        Off by default: it is a call to a third party on every move, and a
        position sensor should not reach outside for something nobody asked
        for. Turn it on where the height matters.
      type: bool
      default: false
      required: false

  state:
    - name: lat
      description: Latitude in decimal degrees
      type: float64
      label: current
      persistent: true
      initialValue: 0
      exposable: true
    - name: lng
      description: Longitude in decimal degrees
      type: float64
      label: current
      persistent: true
      initialValue: 0
      exposable: true
    - name: coordinate
      description: Current position as a single {lat,lng} object, so it can be named as a place in one X-press
      type: object
      subType: location_coordinate
      label: current
      persistent: true
      exposable: true
    - name: accuracy
      description: Accuracy in metres
      type: float64
      label: current
      persistent: true
      initialValue: 0
      exposable: true
    - name: altitude
      description: |
        Height of the DEVICE as the positioning hardware measured it, in metres.
        0 on anything positioned by wi-fi — for the height of the ground here,
        see elevation.
      type: float64
      label: current
      persistent: true
      initialValue: 0
      exposable: true
    - name: elevation
      description: |
        Ground height above sea level at this position, in metres, looked up
        from the coordinates the way the address is (GSI's 1m model in Japan,
        Open-Meteo's global model elsewhere) rather than read off the device.
      type: float64
      label: current
      persistent: true
      initialValue: 0
      exposable: true
    - name: device_id
      description: ID of the browser device that sent the last update
      type: string
      label: current
      persistent: true
      initialValue: ""
      exposable: true
    - name: device_name
      description: Human-readable name of the source device
      type: string
      label: current
      persistent: true
      initialValue: ""
      exposable: true
    - name: updated_at
      description: Unix ms timestamp of the last location update
      type: float64
      label: current
      persistent: true
      initialValue: 0
      exposable: true
    - name: city
      description: City or town name from reverse geocoding (Nominatim)
      type: string
      subType: city
      label: current
      persistent: true
      initialValue: ""
      exposable: true
    - name: prefecture
      description: Prefecture or state name from reverse geocoding (Nominatim)
      type: string
      label: current
      persistent: true
      initialValue: ""
      exposable: true
    - name: address
      description: Full human-readable address from reverse geocoding
      type: string
      subType: address
      label: current
      persistent: true
      initialValue: ""
      exposable: true
    - name: label
      description: Display label
      type: string
      label: current
      persistent: true
      initialValue: "My Location"
    - name: webhook_payload
      description: Raw payload from POST /api/v1/webhooks/{id}
      type: object
      label: current
      persistent: false
    - name: webhook_received_at
      description: Timestamp of last received webhook
      type: string
      label: current
      persistent: false
    - name: achieved
      description: Whether the want has achieved its goal
      type: bool
      label: current
      persistent: true
      initialValue: false
    - name: achieving_percentage
      description: Progress percentage
      type: int
      label: current
      persistent: true
      initialValue: 0
    - name: completed
      description: Whether execution has completed
      type: bool
      label: current
      persistent: true
      initialValue: false
    - name: action_by_agent
      description: Name of the agent that last acted on this want
      type: string
      label: current
      persistent: true
      initialValue: ""
    - name: final_result
      description: Final output value
      type: string
      label: current
      persistent: true
      initialValue: ""
    - name: agent_result
      description: Raw result object returned by agent execution
      type: object
      label: current
      persistent: true
    - name: desired_dispatch
      description: Dispatch requests proposed by a thinker child
      type: object
      label: plan
      persistent: false

  examples:
    - description: A location sensor for home
      want:
        metadata:
          name: home-location
          type: location
        spec:
          params:
            label: "Home Device"
