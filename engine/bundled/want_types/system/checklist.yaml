wantType:
  metadata:
    name: checklist
    title: Checklist
    description: A checklist to work through a set of tasks. Tick items off; mark the whole thing Done to achieve and record.
    version: '1.0'
    category: utility
    pattern: independent
    labels:
      user-control: "true"
      type-icon: ListChecks
      # What a person calls it (the robot finds it by these — tools.go's fmAliasLabel).
      aliases: "チェックリスト,やること,やることリスト,タスク,ToDo,todo,checklist"
      # Same flush pressure-plate tile as a note, but its cover is a notepad's:
      # it flips UP off the top edge rather than swinging open to the right.
      form-type: button
      form-style: notepad
      # A navy notebook cover — the surface paints the closed cover in this tone.
      type-tone-color: "#2b3a55"
      # What the tile shows at a glance: how many are done, of how many (6/8).
      tile-readout: "count:items.done/items"
  # Its answer is its list: one kept each time it changes, so the moments
  # below can be told of.
  finalResultField: items
  # Every edit is an answer, and not news (the standard timing "answer"
  # turned off). added: an item put on the list; removed: one taken off.
  timings:
  - name: answer
    description: リストが変わったとき（編集のたびには知らせない）
    icon: list
    murmur: false
    notify: false
  - name: added
    description: アイテムが追加されたとき
    icon: list-plus
    onIncrease: items
    murmur: true
  - name: removed
    description: アイテムが削除されたとき
    icon: list-minus
    onDecrease: items
  - name: checked
    description: アイテムに済みをつけたとき
    icon: check-circle
    onIncrease: count:items.done
    murmur: true
  - name: completed
    description: 全部終わったとき
    icon: trophy
    if: all:items.done
    murmur: true
  # What a want of this type does with a murmur it heard (spec.hear).
  hearing:
    kind: propose
    description: 持っていくといいものを、リストに足すか聞く
  parameters:
  - name: items
    description: Initial checklist lines, plain strings — each becomes an unchecked item
    type: array
    required: false
    default: []
  state:
  - name: items
    description: 'Checklist items: [{ id, text, done }]'
    type: array
    label: current
    persistent: true
    initialValue: []
  - name: characters
    description: Character IDs currently standing on this want's tile (kept in sync by footsteps — see button_occupancy.go)
    type: array
    label: current
    persistent: true
  examples:
  - title: Empty checklist
    description: A blank checklist to add items to on the dashboard
    want:
      metadata:
        name: my-checklist
        type: checklist
  - title: Checklist with items
    description: A checklist that starts with a few tasks already on it
    want:
      metadata:
        name: packing
        type: checklist
      spec:
        params:
          items: ["passport", "charger", "toothbrush"]
