wantType:
  metadata:
    name: gauge
    title: Gauge
    description: |
      Displays an imported integer value (0-100) as a progress gauge card.
      Import any exposable integer percentage field from another want via spec.imports.
      Connect to a provider want using: mywant-gui connect <provider> <this-want>
      No polling script needed: the imported value is reflected live in the want hash,
      and the frontend re-renders within 250ms of any provider update.
    version: '1.2'
    category: system
    pattern: independent
    labels:
      user-control: "true"
      type-icon: "Gauge"

  state:
    - name: value_pct
      description: Current gauge value (0-100), populated via spec.imports
      type: int
      subType: percentage
      label: current
      persistent: false
      initialValue: 0

  examples:
    - name: Claude Session Gauge
      description: Show Claude session usage percentage as a gauge
      want:
        metadata:
          name: my-claude-gauge
          type: gauge
        spec:
          params: {}
