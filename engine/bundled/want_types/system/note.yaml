wantType:
  metadata:
    name: note
    title: Sticky Note
    description: A sticky note to jot down anything. Mark as Done to achieve and record.
    version: '1.0'
    category: utility
    pattern: independent
    labels:
      # What the robot reads a request against, when it asks Laya which want
      # it is: the type in a few words of its own (laya-option).
      laya-option: "メモを貼る"
      aliases: "note,メモ,付箋"
      user-control: "true"
      type-icon: StickyNote
      form-type: button
      form-style: book
  # No parameters: what a note says is its `content` field, written on the
  # board (or by whatever writes the field) — never a parameter, which the
  # field never read from.
  parameters: []
  state:
  - name: content
    description: Note text content
    type: string
    label: current
    persistent: true
    initialValue: ''
  - name: characters
    description: Character IDs currently standing on this want's tile (kept in sync by footsteps — see button_occupancy.go)
    type: array
    label: current
    persistent: true
  examples:
  - title: Empty note
    description: A blank sticky note to type into on the dashboard
    want:
      metadata:
        name: my-note
        type: note

  # How a want of this type is asked for, in words, and what it is made with
  # (want-spec asks): what reads requests (the robot, Laya) learns from these
  # and is tested on them. A parameter left out is one the request does not say.
  asks:
    - say: "メモを置いて"
      variants: ["メモを貼って", "メモを作る", "メモ書きを置いて"]
    - say: "付箋を貼って"
      variants: ["付箋を置いて", "付箋にメモ", "付箋がほしい"]
    - say: "メモ"
      variants: ["メモ帳", "書き留めるメモ"]
