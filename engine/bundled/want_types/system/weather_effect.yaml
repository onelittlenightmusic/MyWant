wantType:
  metadata:
    name: weather_effect
    title: Weather Effect
    description: |
      Receives weather condition via expose/import from a weather want and
      makes it available for canvas/list overlay rendering.

      Usage:
        spec:
          imports:
            weather_condition: weather_condition
            weather_text: weather_text
    version: '2.0'
    category: ui
    pattern: independent
    labels:
      user-control: "true"

  state:
    - name: weather_condition
      description: Canonical condition (rain/storm/cloudy/snow/fog/sunny/default)
      type: string
      subType: weather
      label: current
      persistent: true
      initialValue: ""
    - name: weather_text
      description: Human-readable weather summary text
      type: string
      subType: weather
      label: current
      persistent: true
      initialValue: ""

    - name: weather_intensity
      description: Effect intensity 0-100
      type: int
      label: current
      persistent: false
      initialValue: 60

  examples:
    - name: Weather Effect via import
      description: Import weather condition from an existing weather want
      want:
        metadata:
          name: my-weather-effect
          type: weather_effect
        spec:
          imports:
            weather_condition: weather_condition
            weather_text: weather_text
