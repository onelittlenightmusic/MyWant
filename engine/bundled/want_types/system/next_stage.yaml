wantType:
  metadata:
    name: next_stage
    title: Next Stage
    description: |
      A canvas-grid portal that advances a running skills-rpg (rpg-server,
      port 7100, no auth) to a specific stage and warps CursorMan to
      target_x/target_y (normally a `startpoint` want's position in that next
      stage) on this same mywant canvas.

      Pressing "進む" on this want's card writes rpg_next_stage_id into the
      "pending_jump" state field; a monitor_mrs_agent poll (~1s) notices it and
      sends rpg-server the game's ORDINARY advance action (POST /api/v1/control,
      actor=you action=advance), then clears pending_jump back to "" (see
      ~/.mywant/custom-types/rpg-stage-jump/main.py, shared with `startpoint`,
      which sends "return" through the same field to go the other way).

      Not the debug jump. That endpoint restores the stage it lands on from its
      pristine YAML and empties inventory and achievements — a testing restart,
      which as a way to travel meant leaving a stage and coming back re-armed
      every alarm. Advancing normally also means the stage has to be cleared
      first: a refusal comes back in last_jump_result for the card to show.

      The canvas-side CursorMan warp fires immediately on press — it does not
      wait for rpg-server, so the two are only loosely (~1s) synchronized.

      The pair: this want sits in a stage's last room and sends the game
      forward to the next stage's start point; that start point sends it back
      here.

      Purely a canvas-grid fixture: it is not shown in the want dashboard's
      card list (labels.list-visible: "false").
    version: '1.0'
    category: game
    pattern: independent
    labels:
      type-icon: "LogIn"
      list-visible: "false"
      # The card carries a control the user presses, so the card can be
      # operated: Enter/A drills into it and the button joins the tab ring.
      user-control: "true"

  parameters:
    - name: rpg_next_stage_id
      description: skills-rpg stage id to jump to (e.g. "stage2")
      type: string
      required: true
    - name: target_x
      description: Grid x-coordinate to place CursorMan at after triggering (normally the next stage's startpoint)
      type: int
      required: false
      default: 0
    - name: target_y
      description: Grid y-coordinate to place CursorMan at after triggering (normally the next stage's startpoint)
      type: int
      required: false
      default: 0

  state:
    - name: rpg_next_stage_id
      type: string
      label: current
      persistent: true
      initialValue: ""
    - name: target_x
      type: int
      label: current
      persistent: true
      initialValue: 0
    - name: target_y
      type: int
      label: current
      persistent: true
      initialValue: 0
    # Declared here, not only in the agent's state_updates: a state write to a
    # key the want type never declared is refused by governance, and the field
    # the card writes has to exist before the agent has ever run. The agent
    # says how to fill them from the script's output; the type says they exist.
    - name: pending_jump
      description: Set by the card's button to the stage to travel to; cleared back to "" once the poll has sent the action. Empty = idle.
      type: string
      label: current
      persistent: true
      initialValue: ""
    - name: last_jump_result
      description: ok, or why the game refused (e.g. current stage is not cleared yet).
      type: string
      label: current
      persistent: true
      initialValue: ""
    - name: summary
      description: What the want is waiting for, while it waits.
      type: string
      label: current
      persistent: false
      initialValue: ""
    - name: skill_json_arg_template
      type: string
      label: current
      persistent: true
      initialValue: ""
    - name: skill_json_arg
      type: string
      label: current
      persistent: false
      initialValue: ""

  onInitialize:
    current:
      rpg_next_stage_id: '${rpg_next_stage_id}'
      target_x: '${target_x}'
      target_y: '${target_y}'
      skill_json_arg_template: '{"pending_jump":"%{pending_jump}","direction":"advance"}'

  requires:
    - rpg_stage_jump

  examples:
    - title: Portal to stage2, landing at its start point
      description: Advances rpg-server to stage2 and warps CursorMan to (8, 12) — wherever stage2's startpoint want sits.
      want:
        metadata:
          name: stage1-to-stage2
          type: next_stage
          labels:
            mywant.io/canvas-x: "4"
            mywant.io/canvas-y: "2"
        spec:
          params:
            rpg_next_stage_id: stage2
            target_x: 8
            target_y: 12
