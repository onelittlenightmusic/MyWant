wantType:
  metadata:
    name: fireworks_effect
    title: Fireworks Effect
    description: Triggers a fireworks particle animation on the web canvas when a button is pressed.
    version: '1.0'
    category: effect
    pattern: independent
    labels:
      # What the robot reads a request against, when it asks Laya which want
      # it is: the type in a few words of its own (laya-option).
      laya-option: "花火を打ち上げる"
      aliases: "fireworks,花火"
      riffable: reaction
      type-icon: Sparkles
  # What a want of this type does with a murmur it heard (spec.hear).
  hearing:
    kind: act
    description: 盤面で花火を上げる
  parameters:
    - name: input_button
      type: string
      default: "button-x"
      label: Trigger button
      description: "Button/key that triggers this want (e.g. button-x, y-button, menu-toggle)"
    - name: input_action
      type: string
      default: "trigger"
      label: Webhook action
      description: Webhook action name to dispatch on button press
    - name: input_condition
      type: string
      default: ""
      label: Trigger condition
      description: "empty-space = only when cursor is on empty canvas cell; leave blank for always"
  state:
    - name: fireworks_triggers
      description: Number of times the fireworks effect has been triggered
      type: integer
      label: current
      persistent: true
      exposable: true
    - name: webhook_payload
      description: Payload received via POST /api/v1/webhooks/{id}; consumed by Progress()
      type: object
      label: current
    - name: webhook_received_at
      description: Timestamp of the last received webhook
      type: string
      label: current

  # How a want of this type is asked for, in words, and what it is made with
  # (want-spec asks): what reads requests (the robot, Laya) learns from these
  # and is tested on them. A parameter left out is one the request does not say.
  asks:
    - say: "花火を置いて"
      variants: ["花火を打ち上げて", "花火を上げる", "花火を出して"]
    - say: "花火"
      variants: ["打ち上げ花火", "花火を上げて"]
