openapi: 3.0.3
info:
  title: MyWant Want Type Definition Schema
  description: OpenAPI specification for MyWant want type YAML definition files
  version: 1.0.0
  contact:
    name: MyWant
    url: https://github.com/onelittlenightmusic/MyWant

paths: {}

components:
  schemas:
    # Root want type wrapper
    WantTypeWrapper:
      type: object
      description: Root wrapper for want type definition
      required:
        - wantType
      properties:
        wantType:
          $ref: '#/components/schemas/WantTypeDefinition'
      additionalProperties: false

    # Complete want type definition
    WantTypeDefinition:
      type: object
      description: Complete want type definition
      required:
        - metadata
      properties:
        metadata:
          $ref: '#/components/schemas/WantTypeMetadata'
        parameters:
          type: array
          description: Parameter definitions for want configuration
          items:
            $ref: '#/components/schemas/ParameterDef'
          default: []
        state:
          type: array
          description: State field definitions
          items:
            $ref: '#/components/schemas/StateDef'
          default: []
        connectivity:
          $ref: '#/components/schemas/ConnectivityDef'
        connect:
          description: Connectivity requirement specification
          allOf:
            - $ref: '#/components/schemas/RequireSpec'
        require:
          description: Structured connectivity requirement (deprecated, use connect)
          allOf:
            - $ref: '#/components/schemas/RequireSpec'
        usageLimit:
          description: Deprecated, use connect instead
          allOf:
            - $ref: '#/components/schemas/UsageLimitSpec'
        requires:
          type: array
          description: Agent capability requirements including ThinkAgent capabilities (must be at wantType level)
          items:
            type: string
          default: []
        monitorCapabilities:
          type: array
          description: MonitorAgent capabilities provided by this want type
          items:
            $ref: '#/components/schemas/MonitorCapabilityDef'
          default: []
        capabilities:
          type: array
          description: |
            What a want of this type can answer, beyond its own result — each
            said in words for the robot to choose by, and how it is done: a
            prompt over data the server hands it (reads), or a Machine-Readable
            Skill of the type's own. Not an agent's capability (requires,
            monitorCapabilities): those are what a want needs; these are what
            it offers.
          items:
            $ref: '#/components/schemas/WantCapabilityDef'
          default: []
        finalResultField:
          type: string
          description: Default state key for final_result
        globalOverrideFrom:
          type: string
          description: |
            Name of a global parameter whose value is written into this want's state
            on initialization, overriding any local default.
        agents:
          type: array
          description: Agent definitions
          items:
            $ref: '#/components/schemas/AgentDef'
          default: []
        inlineAgents:
          type: array
          description: Inline agent definitions with embedded scripts
          items:
            $ref: '#/components/schemas/InlineAgentDef'
          default: []
        finalizeWhen:
          description: Declarative termination conditions grouping achieved and failed outcomes.
          allOf:
            - $ref: '#/components/schemas/FinalizeWhen'
        achievedWhen:
          description: "Deprecated: use finalizeWhen.achieved instead."
          allOf:
            - $ref: '#/components/schemas/ConditionDef'
        onInitialize:
          description: Actions to execute when the want is initialized
          allOf:
            - $ref: '#/components/schemas/LifecycleHookDef'
        onDelete:
          description: Actions to execute when the want is deleted
          allOf:
            - $ref: '#/components/schemas/LifecycleHookDef'
        onAchieved:
          description: Actions to execute when the want reaches the achieved state
          allOf:
            - $ref: '#/components/schemas/LifecycleHookDef'
        constraints:
          type: array
          description: Business logic constraints
          items:
            $ref: '#/components/schemas/ConstraintDef'
          default: []
        examples:
          type: array
          description: Usage examples
          items:
            $ref: '#/components/schemas/ExampleDef'
          default: []
        relatedTypes:
          type: array
          description: Related want type names
          items:
            type: string
          default: []
        seeAlso:
          type: array
          description: Documentation references
          items:
            type: string
          default: []
        goType:
          type: string
          description: |
            Fully-qualified Go type name that implements this want type's engine logic.
            Used by the engine to instantiate the correct struct at runtime.
          example: "mywant.QueueWant"
      additionalProperties: false

    # Want type metadata
    WantTypeMetadata:
      type: object
      description: Want type identity and classification
      required:
        - name
        - title
        - description
        - version
        - category
        - pattern
      properties:
        name:
          type: string
          description: Unique want type name
          pattern: '^[a-z][a-z0-9_]*$'
        title:
          type: string
          description: Human-readable title
        description:
          type: string
          description: Detailed description
        version:
          type: string
          description: Version string
          pattern: '^\d+\.\d+(\.\d+)?$'
        category:
          type: string
          description: Want type category
        pattern:
          type: string
          description: Want type pattern
          enum:
            - generator
            - processor
            - sink
            - independent
            - coordinator
        system_type:
          type: boolean
          description: If true, hide from user-facing want type selector
          default: false
        labels:
          type: object
          description: Key-value labels for grouping or filtering want types
          additionalProperties:
            type: string
      additionalProperties: false

    # Parameter definition
    ParameterDef:
      type: object
      description: Parameter definition for want configuration
      required:
        - name
        - description
        - type
        - required
      properties:
        name:
          type: string
          description: Parameter name
          pattern: '^[a-z][a-z0-9_]*$'
        title:
          type: string
          description: |
            What the parameter is called on screen, when its name (an ASCII
            identifier) is not what anybody would call it.
        description:
          type: string
          description: Parameter description
        type:
          type: string
          description: Go type (int, float64, string, bool, []string, map[string]any)
        label:
          type: string
          description: |
            UI / semantic label for this parameter (e.g. "goal", "current", "plan", "internal").
          enum: [goal, current, plan, internal]
        default:
          description: Default value
        defaultGlobalParameter:
          type: string
          description: Global parameter key to use as fallback when neither spec.params nor default is set
          pattern: '^[a-z][a-z0-9_]*$'
        defaultGlobalParameterFrom:
          type: string
          description: |
            Like defaultGlobalParameter but the key itself is resolved from another
            global parameter. Useful for indirection (e.g. tenant-specific defaults).
          pattern: '^[a-z][a-z0-9_]*$'
        required:
          type: boolean
          description: Whether parameter is required
        validation:
          $ref: '#/components/schemas/ValidationRules'
        example:
          description: Example value
        subType:
          type: string
          description: |
            Semantic category of this parameter's value: what a value entered
            here IS, which drives autocomplete and what catalog it is remembered
            in. Examples: station, place, city, date, port.
        accepts:
          type: array
          description: |
            Further categories this parameter takes, without changing what a
            value entered here is recorded as. A route's `from` accepts a
            station, a named place, a coordinate or an address; subType stays
            the one it records under. subType is always accepted and need not
            be repeated. Absent means the parameter takes its subType alone.
          items:
            type: string
        recordThing:
          type: boolean
          description: |
            Whether values entered here are remembered as things. Defaults to
            true when subType is set; set false for secrets.
        recordMemo:
          type: boolean
          deprecated: true
          description: What recordThing was called before things were called things.
        backgroundImage:
          type: string
          description: |
            A picture of what this parameter stands for, drawn behind its card:
            a URL, or a data: URL. A web want's parameters are the objects saved
            on its page, each shown as it looked there.
      additionalProperties: false

    # Validation rules
    ValidationRules:
      type: object
      description: Validation constraints for parameters
      properties:
        min:
          type: number
          description: Minimum value
        max:
          type: number
          description: Maximum value
        pattern:
          type: string
          description: Regex pattern
        enum:
          type: array
          description: Allowed values
          items: {}
      additionalProperties: false

    # State definition
    StateDef:
      type: object
      description: State field definition
      required:
        - name
        - description
        - type
        - persistent
      properties:
        name:
          type: string
          description: State field name
          pattern: '^[a-z][a-z0-9_]*$'
        description:
          type: string
          description: State field description
        type:
          type: string
          description: State field type
        label:
          type: string
          description: State label (goal, current, plan, internal)
          enum: [goal, current, plan, internal]
        persistent:
          type: boolean
          description: Whether state persists across restarts
        initialValue:
          description: Initial value
        example:
          description: Example value
        onFetchData:
          type: string
          description: JSON path to extract from script json_data output (e.g. "routes[0].departure")
        fetchFrom:
          type: string
          description: |
            State key (in another want or global scope) to transparently read the
            value from. Useful for aliasing a remote field into local state.
          example: "global_budget"
      additionalProperties: false

    # Connectivity definition
    ConnectivityDef:
      type: object
      description: Input/output patterns
      properties:
        inputs:
          type: array
          description: Input channel definitions
          items:
            $ref: '#/components/schemas/ChannelDef'
          default: []
        outputs:
          type: array
          description: Output channel definitions
          items:
            $ref: '#/components/schemas/ChannelDef'
          default: []
      additionalProperties: false

    # Channel definition
    ChannelDef:
      type: object
      description: Input or output channel definition
      required:
        - name
        - type
        - description
      properties:
        name:
          type: string
          description: Channel name
        type:
          type: string
          description: Channel type
          enum:
            - want
            - agent
            - state
            - event
        data_type:
          type: string
          description: Optional data type carried by this channel
        description:
          type: string
          description: Channel description
        required:
          type: boolean
          description: Whether channel is required
          default: false
        multiple:
          type: boolean
          description: Whether multiple connections allowed
          default: false
      additionalProperties: false

    # Require spec
    RequireSpec:
      type: object
      description: Structured connectivity requirements
      required:
        - type
      properties:
        type:
          type: string
          description: Connectivity policy
          enum:
            - none
            - users
            - providers
            - providers_and_users
        providers:
          type: array
          description: Input connection specifications
          items:
            $ref: '#/components/schemas/ConnectionSpec'
          default: []
        users:
          type: array
          description: Output connection specifications
          items:
            $ref: '#/components/schemas/ConnectionSpec'
          default: []
      additionalProperties: false

    # Connection spec
    ConnectionSpec:
      type: object
      description: Single connection definition
      required:
        - name
        - type
        - description
        - required
        - multiple
      properties:
        name:
          type: string
          description: Connection name
        type:
          type: string
          description: Connection type
        data_type:
          type: string
          description: Optional data type for this connection
        description:
          type: string
          description: Connection description
        required:
          type: boolean
          description: Whether connection is required
        multiple:
          type: boolean
          description: Whether multiple connections allowed
      additionalProperties: false

    # Usage limit spec (deprecated)
    UsageLimitSpec:
      type: object
      description: Deprecated usage limit specification (use connect instead)
      additionalProperties: true

    # Monitor capability definition
    WantCapabilityDef:
      type: object
      description: |
        One thing a want of this type can answer. The robot chooses it by its
        description; the server does it — gathering only the data named in
        reads and handing it, with the prompt, to the model that words the
        answer, or running the skill named. Nothing else is reached.
      required:
        - name
        - description
      properties:
        name:
          type: string
          description: The capability's name, unique in its type
          example: "latest_score"
        description:
          type: string
          description: What it answers, in the person's words — what the robot chooses it by
          example: "最新のゴルフのスコアを検索できる"
        reads:
          type: array
          description: |
            The data the server gathers for the prompt, by kind: answers (the
            want's kept answers), answer_photos (the photos joined to its
            answers, with what was read off them), state (its current state).
          items:
            type: string
            enum: [answers, answer_photos, state]
          default: []
        prompt:
          type: string
          description: How to answer from the data read — given to the model with it
        skill:
          type: string
          description: |
            A Machine-Readable Skill to run instead, its path relative to the
            type's own directory (and inside it); the question is passed to it
            as {"question": ...} and what it prints is the answer's data.
      additionalProperties: false

    MonitorCapabilityDef:
      type: object
      description: Describes a capability provided by a MonitorAgent in this want type
      required:
        - capability
      properties:
        capability:
          type: string
          description: Capability identifier string
          example: "temperature_read"
        intervalSeconds:
          type: integer
          description: Default polling interval in seconds (0 = event-driven)
          default: 0
      additionalProperties: false

    # Lifecycle hook definition
    LifecycleHookDef:
      type: object
      description: Actions executed at a want lifecycle event (onInitialize, onDelete, onAchieved)
      properties:
        params:
          type: object
          description: Copy want params into current state (key=stateField, value=paramName)
          additionalProperties:
            type: string
        current:
          type: object
          description: Set current state fields to literal values
          additionalProperties: true
        plan:
          type: object
          description: Set plan state fields to literal values
          additionalProperties: true
        goal:
          type: object
          description: Set goal state fields to literal values
          additionalProperties: true
        mergeParent:
          type: object
          description: |
            Merge fields from the parent want's state into this want's state.
            Key = local state field, value = parent state field to copy from.
          additionalProperties: true
        executeAgents:
          type: boolean
          description: Call ExecuteAgents() after applying state changes
      additionalProperties: false

    # Condition definition
    ConditionDef:
      type: object
      description: Single declarative state condition
      required:
        - field
        - operator
        - value
      properties:
        field:
          type: string
          description: State field name to evaluate
        operator:
          type: string
          description: Comparison operator
          enum: ["==", "!=", ">", ">=", "<", "<="]
        value:
          description: Value to compare against
      additionalProperties: false

    # Finalize when (groups achieved + failed conditions)
    FinalizeWhen:
      type: object
      description: Declarative termination conditions grouping achieved and failed outcomes.
      properties:
        achieved:
          $ref: '#/components/schemas/ConditionDef'
        failed:
          $ref: '#/components/schemas/ConditionDef'
      additionalProperties: false

    # Inline agent definition
    InlineAgentDef:
      type: object
      description: Executable agent with inline script embedded in a YAML want type
      required: [name, type, runtime]
      properties:
        name:
          type: string
        type:
          type: string
          enum: [think, do, monitor]
        runtime:
          type: string
          enum: [shell, python, rego]
        script:
          type: string
          description: Inline script source
        scriptFile:
          type: string
          description: Path to an external script file (alternative to script)
        interval:
          type: integer
          description: Execution interval in seconds (0 = default)
          default: 0
      additionalProperties: false

    # Agent definition
    AgentDef:
      type: object
      description: Agent integration definition
      required:
        - name
        - role
        - description
      properties:
        name:
          type: string
          description: Agent name
        role:
          type: string
          description: Agent role
          enum:
            - monitor
            - action
            - validator
            - transformer
        description:
          type: string
          description: Agent description
        example:
          type: string
          description: Usage example
      additionalProperties: false

    # Constraint definition
    ConstraintDef:
      type: object
      description: Business logic constraint
      required:
        - description
        - validation
      properties:
        description:
          type: string
          description: Constraint description
        validation:
          type: string
          description: Validation rule
      additionalProperties: false

    # Example definition
    ExampleDef:
      type: object
      description: Usage example
      required:
        - name
        - description
        - want
        - expectedBehavior
      properties:
        name:
          type: string
          description: Example name
        description:
          type: string
          description: Example description
        want:
          type: object
          description: Full want configuration
          additionalProperties: true
        expectedBehavior:
          type: string
          description: Expected behavior description
      additionalProperties: false
