openapi: 3.0.3
info:
  title: MyWant Act Schema
  description: |
    OpenAPI specification for a MyWant Act — a Plan (plan-spec.yaml) carried
    out, kept like a Kubernetes Job. Posting one that names a Plan is what
    makes something happen on the board; it is answered at once, Pending, and
    carried out behind it, its status written as it goes:

      Pending → Running → Succeeded | Failed

    Kept by the backend:

      POST   /api/v1/acts           Act (YAML or JSON) → Act, Pending
      GET    /api/v1/acts           ActList, newest first (?limit=)
      GET    /api/v1/acts/{name}    Act as far as it has got;
                                    ?wait=<seconds> holds the answer until it
                                    is done (or the seconds are up)
      DELETE /api/v1/acts/{name}    its record let go — what it did stays done

    Answered as JSON, or YAML with ?format=yaml. An act left Pending or
    Running when the server stopped is Failed when it starts again.
  version: 1.0.0
  contact:
    name: MyWant
    url: https://github.com/onelittlenightmusic/MyWant

paths: {}

components:
  schemas:
    Act:
      type: object
      required:
        - spec
      properties:
        apiVersion:
          type: string
          example: "mywant.io/v1"
        kind:
          type: string
          enum: ["Act"]
        metadata:
          $ref: './plan-spec.yaml#/components/schemas/ResourceMeta'
        spec:
          $ref: '#/components/schemas/ActSpec'
        status:
          $ref: '#/components/schemas/ActStatus'
      additionalProperties: false

    ActSpec:
      type: object
      required:
        - plan
      properties:
        plan:
          type: string
          description: The name of the Plan carried out.
          example: "plan-1762168737000000000"
        turn:
          type: string
          description: The robot's turn it belongs to, if any.
        locale:
          type: string
          example: "ja_JP"
      additionalProperties: false

    ActStatus:
      type: object
      description: Written by the server; ignored when posted.
      properties:
        phase:
          type: string
          enum: ["Pending", "Running", "Succeeded", "Failed"]
        startTime:
          type: string
          format: date-time
        completionTime:
          type: string
          format: date-time
        steps:
          type: array
          description: Each tool run, as it is done — the same runs /api/v1/tools/call makes.
          items:
            $ref: '#/components/schemas/RobotStep'
        cards:
          type: array
          description: What the steps showed.
          items:
            $ref: '#/components/schemas/RobotCard'
        prompt:
          type: string
          description: When done — what to word the answer from.
        message:
          type: string
          description: When failed — why.
      additionalProperties: false

    RobotStep:
      type: object
      required:
        - tool
      properties:
        tool:
          type: string
          example: "use_capability"
        arguments:
          type: object
          additionalProperties:
            type: string
        output:
          type: string
        card:
          $ref: '#/components/schemas/RobotCard'
        done:
          type: boolean
          description: Run against the server already.
        at:
          type: string
          format: date-time
      additionalProperties: false

    RobotCard:
      type: object
      required:
        - kind
        - id
      properties:
        kind:
          type: string
          example: "want"
        id:
          type: string
        name:
          type: string
        type:
          type: string
        status:
          type: string
        summary:
          type: string
      additionalProperties: false

    ActList:
      type: object
      properties:
        acts:
          type: array
          items:
            $ref: '#/components/schemas/Act'
