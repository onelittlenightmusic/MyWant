openapi: 3.0.3
info:
  title: MyWant Character Skill Schema
  description: |
    OpenAPI specification for MyWant character skill YAML — what a character
    can do on the board, one of the skills the Y button's slot equips with its
    digits (投げる, 接続, 型, …). Defined by whatever gives the board the skill
    (a GUI extension, which puts it to the backend when it starts) and kept by
    the backend:

      GET    /api/v1/character-skills          {skills: [...]} in their digits' order
      POST   /api/v1/character-skills          a new one (409 when its name is taken)
      GET    /api/v1/character-skills/{name}
      PUT    /api/v1/character-skills/{name}   made or replaced
      DELETE /api/v1/character-skills/{name}

    Not a Machine-Readable Skill (agent-spec.yaml's MRSAgentDef), which is
    what an agent runs.
  version: 1.0.0
  contact:
    name: MyWant
    url: https://github.com/onelittlenightmusic/MyWant

paths: {}

components:
  schemas:
    CharacterSkill:
      type: object
      description: One character skill.
      required:
        - kind
        - metadata
        - spec
      properties:
        apiVersion:
          type: string
          description: The schema's version.
          example: "mywant.io/v1"
        kind:
          type: string
          enum: ["CharacterSkill"]
        metadata:
          $ref: '#/components/schemas/CharacterSkillMetadata'
        spec:
          $ref: '#/components/schemas/CharacterSkillSpec'
      additionalProperties: false

    CharacterSkillMetadata:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: Its id — what equips it and what it is kept by.
          pattern: '^[a-z0-9][a-z0-9-]*$'
          example: "throw"
        labels:
          type: object
          additionalProperties:
            type: string
      additionalProperties: false

    CharacterSkillSpec:
      type: object
      required:
        - label
        - digit
      properties:
        label:
          type: string
          description: What it is called on the board, by the badge at the character's shoulder.
          example: "投げる"
        digit:
          type: integer
          description: The key that equips it — its rung on the slot's ladder.
          minimum: 0
          maximum: 9
          example: 1
        description:
          type: string
          description: What it does, for a person — and what its picture is drawn from.
          example: "手の届くところにある Thing を拾い上げ、狙った want に投げ込んで、その値を want に渡す。"
      additionalProperties: false
