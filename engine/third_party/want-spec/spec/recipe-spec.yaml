openapi: 3.0.3
info:
  title: MyWant Recipe Schema
  description: OpenAPI specification for MyWant recipe YAML files based on actual Go implementation
  version: 1.0.0
  contact:
    name: MyWant
    url: https://github.com/onelittlenightmusic/MyWant

components:
  schemas:
    # Root recipe object
    GenericRecipe:
      type: object
      description: Root recipe object for MyWant recipes
      required:
        - recipe
      properties:
        recipe:
          $ref: '#/components/schemas/RecipeContent'
      additionalProperties: false

    # Recipe content with metadata, parameters, wants, and results
    RecipeContent:
      type: object
      description: Recipe content containing parameters, wants, and result specifications
      properties:
        metadata:
          $ref: '#/components/schemas/GenericRecipeMetadata'
        parameters:
          type: array
          description: |
            Parameter definitions for this recipe. Each entry is a ParameterDef
            specifying name, type, default, and validation. This replaces the
            legacy map-based parameters + parameter_descriptions pair.
          items:
            $ref: '#/components/schemas/ParameterDef'
          default: []
        wants:
          type: array
          description: Array of recipe want definitions
          items:
            $ref: '#/components/schemas/RecipeWant'
        state:
          type: array
          description: "Coordinator-level state fields that will be added to the Target's ProvidedStateFields"
          items:
            $ref: '#/components/schemas/StateDef'
        result:
          $ref: '#/components/schemas/RecipeResult'
        finalResultField:
          type: string
          description: State field name to use as the primary result for this recipe
        example:
          $ref: '#/components/schemas/RecipeExample'
        examples:
          type: array
          description: Named example usages of this recipe with pre-filled parameters
          items:
            $ref: '#/components/schemas/RecipeExampleDef'
          default: []
      additionalProperties: false

    # Recipe metadata
    GenericRecipeMetadata:
      type: object
      description: Recipe metadata including name, description, version
      properties:
        id:
          type: string
          description: Unique recipe identifier
          example: "travel-itinerary-v1"
        name:
          type: string
          description: Recipe name
          example: "Travel Itinerary"
        description:
          type: string
          description: Recipe description
          example: "Complete travel booking coordination"
        version:
          type: string
          description: Recipe version
          example: "1.0.0"
        type:
          type: string
          description: Recipe type (travel, qnet, fibonacci, etc.)
          example: "travel"
        custom_type:
          type: string
          description: Custom type identifier for the recipe
          example: "wait time in queue system"
        category:
          type: string
          description: Recipe category
          example: "system"
      additionalProperties: false

    # Parameter definition (shared with want-type-spec)
    ParameterDef:
      type: object
      description: Parameter definition for want or recipe configuration
      required:
        - name
        - description
        - type
        - required
      properties:
        name:
          type: string
          description: Parameter name
          pattern: '^[a-z][a-z0-9_]*$'
        description:
          type: string
          description: Parameter description
        type:
          type: string
          description: Go type (int, float64, string, bool, []string, map[string]any)
        label:
          type: string
          description: UI / semantic label (goal, current, plan, internal)
          enum: [goal, current, plan, internal]
        default:
          description: Default value
        defaultGlobalParameter:
          type: string
          description: Global parameter key to use as fallback when neither spec.params nor default is set
          pattern: '^[a-z][a-z0-9_]*$'
        defaultGlobalParameterFrom:
          type: string
          description: |
            Like defaultGlobalParameter but the key itself is resolved from another
            global parameter.
          pattern: '^[a-z][a-z0-9_]*$'
        required:
          type: boolean
          description: Whether parameter is required
        validation:
          $ref: '#/components/schemas/ValidationRules'
        example:
          description: Example value
      additionalProperties: false

    # Validation rules
    ValidationRules:
      type: object
      description: Validation constraints for parameters
      properties:
        min:
          type: number
        max:
          type: number
        pattern:
          type: string
        enum:
          type: array
          items: {}
      additionalProperties: false

    # Recipe want definition (supports both structured and flattened)
    RecipeWant:
      type: object
      description: Want definition in recipe format. Supports structured (metadata/spec) or flattened structure.
      properties:
        # Structured format (preferred)
        metadata:
          $ref: '#/components/schemas/WantMetadata'
        spec:
          $ref: '#/components/schemas/WantSpec'

        # Legacy flattened fields
        name:
          type: string
          description: Want name (optional, auto-generated if not provided)
          example: "my-processor"
        type:
          type: string
          description: Want type that determines processing behavior
          example: "queue"
        labels:
          type: object
          description: Key-value pairs for flexible want connections (map[string]string)
          additionalProperties:
            type: string
          example:
            role: "processor"
            category: "data-processing"
            component: "main-queue"
        params:
          type: object
          description: Want-specific parameters (map[string]interface{})
          additionalProperties: true
          example:
            count: 1000
            service_time: 0.1
        using:
          type: array
          description: Label selectors for connecting to other wants ([]map[string]string)
          items:
            type: object
            description: Label selector map
            additionalProperties:
              type: string
            example:
              role: "source"
        requires:
          type: array
          description: Agent capability requirements
          items:
            type: string
        recipeAgent:
          type: boolean
          description: If true, enables auto-connection logic for this want
      additionalProperties: false

    # Recipe result specification (array format)
    RecipeResult:
      type: array
      description: Array of result specifications with JSON path syntax for extracting metrics
      minItems: 1
      items:
        $ref: '#/components/schemas/RecipeResultSpec'
      example:
        - want_name: "queue-primary"
          stat_name: ".average_wait_time"
          description: "Average wait time in primary stream queue"
        - want_name: "queue-secondary"
          stat_name: ".average_wait_time"
          description: "Average wait time in secondary stream queue"
        - want_name: "queue-final"
          stat_name: "."
          description: "All metrics from final queue"

    # Recipe result specification for individual metrics
    RecipeResultSpec:
      type: object
      description: Specification for computing results from a specific want and stat
      required:
        - want_name
      properties:
        want_name:
          type: string
          description: Name of the want to collect results from
          example: "sink"
        state_field:
          type: string
          description: Name of the state field to use for result computation
          example: "reminder_phase"
        stat_name:
          type: string
          description: JSON path expression for extracting stat values. Use '.' for all stats, or '.field_name' for specific fields
          example: ".average_wait_time"
          pattern: "^\\.$|^\\.[a-zA-Z_][a-zA-Z0-9_]*$"
        description:
          type: string
          description: Human-readable description of this result metric
          example: "Total items processed through the queue system"
      additionalProperties: false

    # Want metadata (structured)
    WantMetadata:
      type: object
      description: Want identification and classification info
      properties:
        id:
          type: string
          description: Unique identifier for the want
        name:
          type: string
          description: Human-readable name
        type:
          type: string
          description: Want type identifier
        labels:
          type: object
          description: Metadata labels for connection and classification
          additionalProperties:
            type: string
        orderKey:
          type: string
          description: Fractional index for custom ordering
      additionalProperties: false

    # Want specification (structured, used in recipe wants)
    WantSpec:
      type: object
      description: Desired state configuration for a want
      properties:
        params:
          type: object
          description: Want-specific parameters
          additionalProperties: true
        exposes:
          type: array
          description: Declares parameters or state fields to expose to a higher scope
          items:
            $ref: '#/components/schemas/ExposeEntry'
        imports:
          type: object
          description: |
            Maps global-state keys to internal state keys (read-only live references).
            Format: { globalKey: internalKey }
          additionalProperties:
            type: string
        using:
          type: array
          description: Label selectors for connections
          items:
            type: object
            additionalProperties:
              type: string
        recipe:
          type: string
          description: Path to recipe file if this is a composite want
        stateSubscriptions:
          type: array
          description: State-change subscriptions from other wants
          items:
            $ref: '#/components/schemas/StateSubscription'
        notificationFilters:
          type: array
          description: Filters applied to received notifications
          items:
            $ref: '#/components/schemas/NotificationFilter'
        requires:
          type: array
          description: Agent capability requirements
          items:
            type: string
        when:
          type: array
          description: Scheduled execution times for this want
          items:
            $ref: '#/components/schemas/WhenSpec'
        finalResultField:
          type: string
          description: State field name to use as the primary result
        resetOnRestart:
          type: boolean
          description: If true (default), state is reset when the want restarts
          default: true
      additionalProperties: false

    # Expose entry
    ExposeEntry:
      type: object
      description: Declares a parameter or state-field exposure from this want to a higher scope
      required:
        - as
      properties:
        param:
          type: string
          description: Name of the spec.params key to expose
        currentState:
          type: string
          description: Name of the current-state field to expose
        as:
          type: string
          description: Key name visible in the outer scope
      additionalProperties: false

    # State subscription
    StateSubscription:
      type: object
      description: Subscribes to state changes from a named want
      required:
        - wantName
      properties:
        wantName:
          type: string
          description: Name of the want to subscribe to
        stateKeys:
          type: array
          description: Specific state keys to watch (empty = all)
          items:
            type: string
        conditions:
          type: array
          description: Filter expressions
          items:
            type: string
        bufferSize:
          type: integer
          description: Notification buffer size (0 = default)
          default: 0
      additionalProperties: false

    # Notification filter
    NotificationFilter:
      type: object
      description: Filters notifications received by this want
      required:
        - sourcePattern
      properties:
        sourcePattern:
          type: string
          description: Glob / regex pattern matching the notification source want name
        stateKeys:
          type: array
          description: Restrict to these state keys (empty = all)
          items:
            type: string
        valuePattern:
          type: string
          description: Optional regex applied to the serialised notification value
      additionalProperties: false

    # Scheduled execution time
    WhenSpec:
      type: object
      description: |
        Defines a scheduled execution time for a Want.
        Exactly one of `at`, `every`, or `fromGlobalParam` should be set.
      properties:
        at:
          type: string
          description: Absolute time expression (e.g. cron string or ISO-8601 datetime)
          example: "0 9 * * 1-5"
        every:
          type: string
          description: Repeat interval (e.g. "30s", "5m", "1h")
          example: "5m"
        fromGlobalParam:
          type: string
          description: Name of a global parameter that resolves to an `at` or `every` value
          example: "check_interval"
      additionalProperties: false

    # State field definition
    StateDef:
      type: object
      description: State field definition for coordinator-level states
      required:
        - name
        - description
        - type
      properties:
        name:
          type: string
          description: State field name
          pattern: '^[a-z][a-z0-9_]*$'
        description:
          type: string
          description: State field description
        type:
          type: string
          description: State field type (int, float64, string, bool, map, etc.)
        label:
          type: string
          description: State label (goal, current, plan, internal)
          enum: [goal, current, plan, internal]
        persistent:
          type: boolean
          description: Whether state persists across restarts
          default: false
        initialValue:
          description: Initial value
        example:
          description: Example value
        onFetchData:
          type: string
          description: JSON path to extract from script json_data output
        fetchFrom:
          type: string
          description: State key to transparently read the value from (aliasing)
      additionalProperties: false

    # Recipe example for one-click deployment
    RecipeExample:
      type: object
      description: Example deployment configuration
      properties:
        wants:
          type: array
          description: Wants to deploy in the example
          items:
            $ref: '#/components/schemas/RecipeWant'
      additionalProperties: false

    # Named recipe example with pre-filled parameters
    RecipeExampleDef:
      type: object
      description: Named example usage of a recipe with pre-filled parameters
      required:
        - name
        - description
        - params
      properties:
        name:
          type: string
          description: Example name
          example: "Small queue system"
        description:
          type: string
          description: Example description
        params:
          type: object
          description: Pre-filled parameter values for this example
          additionalProperties: true
        expectedBehavior:
          type: string
          description: Expected behavior when run with these parameters
      additionalProperties: false

paths: {}  # No REST API paths, this is just for schema validation
