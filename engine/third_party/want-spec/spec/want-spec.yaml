openapi: 3.0.3
info:
  title: MyWant Configuration Schema
  description: OpenAPI specification for MyWant YAML configuration files based on actual Go implementation
  version: 1.0.0
  contact:
    name: MyWant
    url: https://github.com/onelittlenightmusic/MyWant

components:
  schemas:
    # Root configuration object - can either have direct wants or recipe reference
    Config:
      type: object
      description: Root configuration object for MyWant
      anyOf:
        - $ref: '#/components/schemas/DirectWantsConfig'
        - $ref: '#/components/schemas/RecipeBasedConfig'

    # Configuration with directly defined wants array
    DirectWantsConfig:
      type: object
      description: Configuration with directly defined wants
      required:
        - wants
      properties:
        wants:
          type: array
          description: Array of want definitions
          items:
            $ref: '#/components/schemas/Want'
      additionalProperties: false

    # Configuration that references a recipe file
    RecipeBasedConfig:
      type: object
      description: Configuration that references a recipe file
      required:
        - recipe
      properties:
        recipe:
          $ref: '#/components/schemas/RecipeReference'
      additionalProperties: false

    # Recipe reference with path and parameters
    RecipeReference:
      type: object
      description: Reference to a recipe file with parameter overrides
      required:
        - path
      properties:
        path:
          type: string
          description: Path to the recipe YAML file relative to project root
          example: "recipes/travel-itinerary.yaml"
        parameters:
          type: object
          description: Parameters to override recipe defaults
          additionalProperties: true
          example:
            count: 1000
            rate: 10.0
            restaurant_type: "fine dining"
      additionalProperties: false

    # A processing unit in the chain
    Want:
      type: object
      description: A processing unit in the chain with metadata and spec
      properties:
        metadata:
          $ref: '#/components/schemas/Metadata'
        spec:
          $ref: '#/components/schemas/WantSpec'
      required:
        - metadata
        - spec

    # Want metadata with name, type, labels, owner references
    Metadata:
      type: object
      description: Want metadata including identification and labels
      required:
        - name
        - type
      properties:
        name:
          type: string
          description: Unique identifier for this want
          example: "my-processor"
        type:
          type: string
          description: Want type that determines processing behavior
          example: "queue"
        labels:
          type: object
          description: Key-value pairs for flexible want connections (map[string]string)
          additionalProperties:
            type: string
          example:
            role: "processor"
            category: "data-processing"
            stage: "initial"
        ownerReferences:
          type: array
          description: References to owner wants for hierarchical management
          items:
            $ref: '#/components/schemas/OwnerReference'
      additionalProperties: false

    # Want specification with parameters and dependencies
    WantSpec:
      type: object
      description: Want specification including parameters and dependencies
      required:
        - params
      properties:
        params:
          type: object
          description: |
            Want-specific parameters. Each value is either a literal value or a
            global parameter reference using {fromGlobalParam: "key"} — the same
            convention as spec.when[].fromGlobalParam.
          additionalProperties:
            $ref: '#/components/schemas/ParamValue'
          example:
            count: 1000
            rate: 10.0
            service_time: 0.1
            budget:
              fromGlobalParam: global_budget
        exposes:
          type: array
          description: |
            Declares parameters or state fields to expose to a higher scope
            (e.g. from a child want up to its parent/global scope).
          items:
            $ref: '#/components/schemas/ExposeEntry'
        imports:
          type: object
          description: |
            Maps global-state keys to internal state keys.
            Imported fields are read-only: reads transparently return the current
            global-state value; writes are silently blocked.
            Values are never copied — they are always resolved live.
            Format: { globalKey: internalKey }
          additionalProperties:
            type: string
          example:
            global_budget: local_budget
        using:
          type: array
          description: Label selectors for connecting to other wants ([]map[string]string)
          items:
            type: object
            description: Label selector map
            additionalProperties:
              type: string
            example:
              role: "source"
        recipe:
          type: string
          description: Recipe reference for this want
        stateSubscriptions:
          type: array
          description: State-change subscriptions from other wants
          items:
            $ref: '#/components/schemas/StateSubscription'
        notificationFilters:
          type: array
          description: Filters applied to received notifications
          items:
            $ref: '#/components/schemas/NotificationFilter'
        requires:
          type: array
          description: Agent capability requirements (e.g. ThinkAgent capabilities)
          items:
            type: string
          example:
            - "weather_lookup"
        when:
          type: array
          description: Scheduled execution times for this want
          items:
            $ref: '#/components/schemas/WhenSpec'
        finalResultField:
          type: string
          description: |
            Name of the state key whose value is used as the final_result.
            Overrides the want type's default finalResultField if set.
          example: "final_itinerary"
        resetOnRestart:
          type: boolean
          description: |
            If true (default), state is reset when the want restarts.
            Set to false to preserve state across restarts.
          default: true
        alerts:
          type: array
          description: |
            Promises the person who placed this want made about it: each says
            when the want needs them. No alert holding means there is nothing
            they have to come back for.
          items:
            $ref: '#/components/schemas/AlertRule'
      additionalProperties: false

    # Expose entry — declares a param or state exposure between scope levels
    ExposeEntry:
      type: object
      description: |
        Declares a parameter or state-field exposure from this want to a higher scope.
        Exactly one of `param` or `currentState` must be set.
      required:
        - as
      properties:
        param:
          type: string
          description: Name of the spec.params key to expose
          example: "budget"
        currentState:
          type: string
          description: Name of the current-state field to expose
          example: "final_result"
        as:
          type: string
          description: Key name visible in the outer scope
          example: "child_budget"
      additionalProperties: false

    # State subscription — subscribe to state changes from another want
    StateSubscription:
      type: object
      description: Subscribes to state changes from a named want
      required:
        - wantName
      properties:
        wantName:
          type: string
          description: Name of the want to subscribe to
          example: "data-source"
        stateKeys:
          type: array
          description: Specific state keys to watch (empty = all)
          items:
            type: string
        conditions:
          type: array
          description: Filter expressions; only trigger when all conditions are met
          items:
            type: string
        bufferSize:
          type: integer
          description: Notification buffer size (0 = default)
          default: 0
      additionalProperties: false

    # Alert rule — one promise about when a want needs its person
    AlertRule:
      type: object
      description: |
        While this holds, the want needs the person who placed it.
        Exactly one of `when`, `status` or `silentFor` should be set.
      required:
        - name
      properties:
        name:
          type: string
          description: What the person will read when it holds
          example: "雨で中止"
        when:
          $ref: '#/components/schemas/AlertCondition'
        status:
          type: array
          description: Holds while the want is in one of these statuses
          items:
            type: string
          example: ["failed", "waiting_user_action"]
        silentFor:
          type: string
          description: Holds when nothing has changed for this long (Go duration, or days as "2d")
          example: "6h"
        field:
          type: string
          description: With silentFor, the state field that must keep changing (omitted = any state)
          example: "latest_url"
      additionalProperties: false

    # The condition an alert's `when` compares (same shape as a want type's achievedWhen)
    AlertCondition:
      type: object
      required:
        - field
      properties:
        field:
          type: string
          description: State field name to evaluate
        operator:
          type: string
          description: Comparison operator; omitted means the field is true
          enum: ["==", "!=", ">", ">=", "<", "<="]
        value:
          description: Value to compare against
      additionalProperties: false

    # Notification filter — filter incoming notifications
    NotificationFilter:
      type: object
      description: Filters notifications received by this want
      required:
        - sourcePattern
      properties:
        sourcePattern:
          type: string
          description: Glob / regex pattern matching the notification source want name
          example: "sensor-*"
        stateKeys:
          type: array
          description: Restrict to these state keys (empty = all)
          items:
            type: string
        valuePattern:
          type: string
          description: Optional regex applied to the serialised notification value
          example: "^(high|critical)$"
      additionalProperties: false

    # Scheduled execution time
    WhenSpec:
      type: object
      description: |
        Defines a scheduled execution time for a Want.
        Exactly one of `at`, `every`, or `fromGlobalParam` should be set.
      properties:
        at:
          type: string
          description: Absolute time expression (e.g. cron string or ISO-8601 datetime)
          example: "0 9 * * 1-5"
        every:
          type: string
          description: Repeat interval (e.g. "30s", "5m", "1h")
          example: "5m"
        fromGlobalParam:
          type: string
          description: Name of a global parameter that resolves to an `at` or `every` value
          example: "check_interval"
      additionalProperties: false

    # Reference to a global parameter by name (mirrors WhenSpec.fromGlobalParam)
    GlobalParamRef:
      type: object
      description: |
        References a global parameter by name. The resolved value replaces this
        object at runtime — consistent with the fromGlobalParam field in WhenSpec.
      required:
        - fromGlobalParam
      properties:
        fromGlobalParam:
          type: string
          description: Name of the global parameter to read the value from
          example: global_budget
      additionalProperties: false

    # A single parameter value: literal or global reference
    ParamValue:
      description: |
        A parameter value — either a literal (string / number / boolean / array /
        plain object) or a global parameter reference {fromGlobalParam: "key"}.
      oneOf:
        - type: string
          description: Literal string value
        - type: number
          description: Literal numeric value
        - type: boolean
          description: Literal boolean value
        - type: array
          description: Literal array value
          items: {}
        - $ref: '#/components/schemas/GlobalParamRef'
        - type: object
          description: Literal object value (must not contain fromGlobalParam)
          not:
            required:
              - fromGlobalParam
          additionalProperties: true

    # Owner reference for hierarchical management
    OwnerReference:
      type: object
      description: Reference to an owner want for hierarchical management
      required:
        - apiVersion
        - kind
        - name
      properties:
        apiVersion:
          type: string
          description: API version of the owner
          example: "MyWant/v1"
        kind:
          type: string
          description: Kind of the owner resource
          example: "Want"
        name:
          type: string
          description: Name of the owner want
        controller:
          type: boolean
          description: Whether this owner is the controller
          default: false
        blockOwnerDeletion:
          type: boolean
          description: Whether to block owner deletion
          default: false
      additionalProperties: false

    # Memory dump structure for state persistence
    WantMemoryDump:
      type: object
      description: Memory dump structure for persistent state management
      required:
        - timestamp
        - execution_id
        - wants
      properties:
        timestamp:
          type: string
          description: Timestamp of the memory dump
        execution_id:
          type: string
          description: Unique execution identifier
        wants:
          type: array
          description: Array of want states
          items:
            $ref: '#/components/schemas/Want'
      additionalProperties: false

paths: {}  # No REST API paths, this is just for schema validation
