[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mywant"
version = "0.2.0"
description = "Python SDK for MyWant: the server's API, and the want a plugin script runs for"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

# The package itself lives in the engine, which embeds it for plugin scripts
# (engine/core/mrs_sdk.go) — one copy, used by both.
[tool.setuptools]
packages = ["mywant"]
package-dir = { mywant = "../engine/core/pysdk/mywant" }
