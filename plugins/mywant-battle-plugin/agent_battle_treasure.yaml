agent:
  metadata:
    name: battle_treasure_agent
    capability: battle_treasure
    type: monitor
  script:
    path: ./treasure.py
    timeout_seconds: 20
  state_updates:
  - name: hp
    type: float64
    label: current
    persistent: true
    onFetchData: hp
  - name: max_hp
    type: float64
    label: current
    persistent: true
    onFetchData: max_hp
  - name: round
    type: int
    label: current
    persistent: true
    onFetchData: round
  - name: inbox
    type: object
    label: current
    persistent: true
    onFetchData: inbox
