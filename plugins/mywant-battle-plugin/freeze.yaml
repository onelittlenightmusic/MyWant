wantType:
  metadata:
    name: freeze
    title: Freeze
    description: 'A want tile that holds enemies where they are: like a turret it hits an enemy in reach
      every so often, by itself, but its hit stops the enemy — it neither moves nor wears anything down
      — for a while (duration). It keeps to enemies not already held. What it is holding is its connection,
      drawn on the board in yellow.'
    version: '1.0'
    category: game
    pattern: independent
    labels:
      type-icon: Snowflake
      category-icon: Gamepad2
      category-bg-light: 'linear-gradient(160deg, #fef08a 0%, #bae6fd 100%)'
      category-bg-dark: 'linear-gradient(160deg, #713f12 0%, #0c4a6e 100%)'
  parameters:
  - name: range
    description: How far it reaches, in cells
    type: float64
    default: 3
    required: false
  - name: interval
    description: Seconds between hits
    type: float64
    default: 3
    required: false
  - name: duration
    description: Seconds an enemy it hits is held
    type: float64
    default: 2.5
    required: false
  - name: damage
    description: How much one hit also takes off (none, by default — it holds)
    type: float64
    default: 0
    required: false
  - name: strategy
    description: Which enemy in reach it holds — nearest, weakest, or guard (as a turret's)
    type: string
    default: nearest
    required: false
  - name: max_hp
    description: How much it can take, standing in a room's battle
    type: float64
    default: 10
    required: false
  - name: target
    description: The enemy it is aimed at (its room aims it)
    type: string
    required: false
  state:
  - name: hp
    description: What is left of it — its own, taken from the blows and mends sent to it; at 0 it stops
      itself. Kept across a restart; whole again when its battle begins a new round
    type: float64
    label: current
    persistent: true
  - name: max_hp
    description: What it started with
    type: float64
    label: current
    persistent: true
  - name: round
    description: The round of its battle it last made itself whole for
    type: int
    label: current
    persistent: true
  - name: strike
    description: The last shot it sent — {damage, hold, seq} — every interval while it is aimed at something;
      the battle lands each new one, holding what it hits for `hold` seconds
    type: object
    label: current
    volatile: true
    persistent: true
  - name: shots
    description: Hits it has made
    type: int
    label: current
    volatile: true
    persistent: true
  - name: skill_poll_interval_ms
    description: How often its turn comes, in ms (its agent polls at this)
    type: int
    label: goal
    persistent: true
    initialValue: 1000
  - name: inbox
    description: inbox — its own, kept by its script (battle plugin)
    type: object
    label: current
    persistent: true
  - name: strike_clock
    description: strike_clock — its own, kept by its script (battle plugin)
    type: object
    label: current
    persistent: true
  requires:
  - battle_turret
