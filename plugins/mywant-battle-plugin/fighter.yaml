wantType:
  metadata:
    name: fighter
    title: Fighter
    description: 'A character''s sword, a tile standing near the middle of its room. It fights any
      enemy within reach of its tile, as a turret does — first the ones it is told to: tied to it (a
      constellation with it, a capture''s hub) or locked on by its character''s 攻撃 skill (its
      target) — the nearest, one hit every attack_interval seconds, exposed as "<its name>.attack";
      its room has every enemy import that, and only the one a hit names takes it. Made by a battle
      for each character.'
    version: '1.0'
    category: game
    pattern: independent
    labels:
      type-icon: Sword
      category-icon: Gamepad2
  parameters:
  - name: character_id
    description: Whose skill it is
    type: string
    required: true
  - name: target
    description: The enemy its character locked on to with the 攻撃 skill (a constellation with an enemy ties it as well)
    type: string
    required: false
  - name: attack_damage
    description: What one hit takes off
    type: float64
    default: 1
    required: false
  - name: attack_interval
    description: Seconds between hits
    type: float64
    default: 1
    required: false
  - name: reach
    description: How near its character must stand, in cells
    type: float64
    default: 6
    required: false
  state:
  - name: skill_poll_interval_ms
    description: How often its turn comes, in ms
    type: int
    label: goal
    persistent: true
    initialValue: 1000
  - name: strike
    description: Its last hit — {to, damage, seq}
    type: object
    label: current
    persistent: true
  - name: strike_clock
    description: When it last hit, and its number
    type: object
    label: current
    persistent: true
  requires:
  - battle_fighter
