wantType:
  metadata:
    name: battle_reset
    title: Battle Reset
    description: 'A want tile that puts a room defense back as it was: stood on — a button — every want
      its battles suspended in the room is resumed, what was worn is whole again, the enemies leave the
      board, and the battle is ready to begin again.'
    version: '1.0'
    category: game
    pattern: independent
    labels:
      form-type: button
      type-icon: RotateCcw
      category-icon: Gamepad2
      # Its relations are the battle's wiring, not roads to look at (the
      # board's relation_road label).
      relation_road: 'false'
      category-bg-light: 'linear-gradient(160deg, #e2e8f0 0%, #fde68a 100%)'
      category-bg-dark: 'linear-gradient(160deg, #334155 0%, #78350f 100%)'
  parameters:
  - name: battle
    description: The room_defense want it puts back, by name
    type: string
    required: true
  - name: characters
    description: Who is standing on it (filled by footsteps, as a button's is)
    type: array
    subType: character_ids
    required: false
  state:
  - name: characters
    description: Who is standing on it — someone getting on puts the battle back
    type: array
    label: current
    persistent: true
