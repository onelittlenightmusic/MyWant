name: Container Image

# Builds the backend container and publishes it to GHCR. Deployment is NOT done
# here: the `mywant-deploy` repository owns the fly.toml files and holds the
# only Fly.io credential. See docs/DEPLOY_FLY.md.

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/mywant-backend

jobs:
  image:
    name: Build and publish image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # Fly.io machines are amd64; build for that regardless of runner arch.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Optional: tell mywant-deploy a new image is ready. Skipped unless a PAT
      # with `contents: write` on mywant-deploy is configured, so the workflow
      # stays green without it and deployment can simply be triggered manually.
      - name: Notify mywant-deploy
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          TOKEN: ${{ secrets.DEPLOY_DISPATCH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "DEPLOY_DISPATCH_TOKEN not set — skipping deploy trigger."
            exit 0
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository_owner }}/mywant-deploy/dispatches \
            -d '{"event_type":"image-published","client_payload":{"app":"backend","tag":"sha-${{ github.sha }}"}}'
