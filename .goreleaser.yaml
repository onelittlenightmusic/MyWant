version: 2

project_name: mywant

builds:
  - id: mywant
    dir: client
    main: ./cmd/mywant
    binary: mywant
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      # .Tag, not .Version: .Version drops the leading "v", which would make a
      # release report "0.3.16" while a local `make build-cli` (git describe)
      # reports "v0.3.16" for the same commit.
      - -s -w -X main.version={{.Tag}}

archives:
  - id: mywant
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    files:
      - none*

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch

brews:
  - name: mywant
    repository:
      owner: onelittlenightmusic
      name: homebrew-mywant
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    homepage: https://github.com/onelittlenightmusic/MyWant
    description: "Declarative chain programming system - express what you want via YAML, autonomous agents execute it"
    license: "MIT"
    install: |
      bin.install "mywant"
    service: |
      run [opt_bin/"mywant", "start"]
      keep_alive true
      log_path var/"log/mywant.log"
      error_log_path var/"log/mywant.log"
    test: |
      system "#{bin}/mywant", "--version"
